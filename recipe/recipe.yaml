schema_version: 1

context:
  name: tempora
  version: 5.10.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 40bea5d6ab4c3ff70c150fb8baa1aaba3849ced59c4a288e835d2693fd49b301

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - calc-prorate = tempora:calculate_prorated_values

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools_scm >=3.4.1
    - setuptools
  run:
    - python >=${{ python_min }}
    - jaraco.functools
    - python-dateutil
    - jaraco.collections
    - jaraco.context
    - typing_extensions
tests:
  - python:
      imports:
        - tempora
      python_version: ${{ python_min }}.*
about:
  license_file: LICENSE
  license: MIT
  summary: Objects and routines pertaining to date and time (tempora)
  homepage: https://github.com/jaraco/tempora
  repository: https://github.com/jaraco/tempora

extra:
  recipe-maintainers:
    - pmlandwehr
    - carlodri
