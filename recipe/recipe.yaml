schema_version: 1

context:
  name: tempora
  version: "5.13.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 1e6fe03d8c9ccec557e58f18bf3743e6c1a7b09b32bcda07b73be233ef5b24c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - calc-prorate = tempora:calculate_prorated_values

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.11,<4
  run:
    - python >=${{ python_min }}
    - jaraco.functools
    - python-dateutil
    - jaraco.collections
    - jaraco.context
    - typing_extensions

tests:
  - python:
      imports:
        - tempora
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license_file: LICENSE
  license: Apache-2.0
  summary: Objects and routines pertaining to date and time (tempora)
  homepage: https://github.com/jaraco/tempora
  repository: https://github.com/jaraco/tempora

extra:
  recipe-maintainers:
    - pmlandwehr
    - carlodri
