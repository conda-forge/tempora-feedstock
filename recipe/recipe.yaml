schema_version: 1

context:
  name: tempora
  version: 5.12.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b49b78cc7ec0b252bfbd74cef0187121b18e4f5a0c57e3b9c3d8fc15090af3b4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - calc-prorate = tempora:calculate_prorated_values

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit_core
  run:
    - python >=${{ python_min }}
    - jaraco.functools
    - python-dateutil
    - jaraco.collections
    - jaraco.context
    - typing_extensions
tests:
  - python:
      imports:
        - tempora
      python_version: ${{ python_min }}.*
about:
  license_file: LICENSE
  license: MIT
  summary: Objects and routines pertaining to date and time (tempora)
  homepage: https://github.com/jaraco/tempora
  repository: https://github.com/jaraco/tempora

extra:
  recipe-maintainers:
    - pmlandwehr
    - carlodri
